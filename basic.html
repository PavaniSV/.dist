<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body><!DOCTYPE html>
<html>
<head>
    <title>Listing Table</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

    <h2>Product Listing</h2>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Product</th>
                <th>Price</th>
                <th>Status</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>1</td>
                <td>Laptop</td>
                <td>$800</td>
                <td>Available</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Phone</td>
                <td>$500</td>
                <td>Available</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Tablet</td>
                <td>$300</td>
                <td>Out of Stock</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
 
    
</body>
</html>
